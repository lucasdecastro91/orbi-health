workflows:
  ios-build:
    name: iOS — build (sem publicar ainda)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.orbihealth.app"
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependências do Node
        script: npm install
      - name: Build do app web (Vite)
        script: npm run build
      - name: Sincronizar com o projeto iOS (Capacitor)
        script: npx cap sync ios
      - name: Buscar ou gerar certificado e provisioning profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Inicializar o keychain do CI
        script: keychain initialize
      - name: Adicionar certificado ao keychain
        script: keychain add-certificates
      - name: Aplicar assinatura no projeto Xcode
        script: xcode-project use-profiles
      - name: Compilar e gerar o .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
