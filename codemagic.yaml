workflows:
  ios-build:
    name: iOS — build e envio pro TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.orbihealth.app"
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependências do Node
        script: npm install
      - name: Build do app web (Vite)
        script: npm run build
      - name: Sincronizar com o projeto iOS (Capacitor)
        script: npx cap sync ios
      - name: Incrementar número da build
        # CURRENT_PROJECT_VERSION fica fixo em "1" no projeto (gerado pelo
        # Capacitor) e nunca foi incrementado — a Apple rejeita qualquer
        # build com o mesmo número já usado no App Store Connect/TestFlight
        # ("The bundle version must be higher than the previously uploaded
        # version"). Tentativa anterior usava `app-store-connect
        # get-latest-build-number "$BUNDLE_ID"`, mas esse comando espera o
        # Apple ID numérico do app (não o bundle id string) e deu 404.
        # $BUILD_NUMBER é gerado pelo próprio Codemagic, único e crescente
        # a cada build desse workflow — não depende de consultar a Apple.
        script: |
          #!/usr/bin/env bash
          set -e
          set -x
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Buscar ou gerar certificado e provisioning profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Inicializar o keychain do CI
        script: keychain initialize
      - name: Adicionar certificado ao keychain
        script: keychain add-certificates
      - name: Aplicar assinatura no projeto Xcode
        script: xcode-project use-profiles
      - name: Compilar e gerar o .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Sem beta_groups de propósito — vai só pra testadores internos
        # (você), sem passar pela Beta App Review da Apple. Testadores
        # externos (treinadores do beta) entram só quando o app for pra
        # App Store de verdade.
        submit_to_testflight: true
