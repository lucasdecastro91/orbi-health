workflows:
  ios-build:
    name: iOS — build e envio pro TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.orbihealth.app"
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependências do Node
        script: npm install
      - name: Build do app web (Vite)
        script: npm run build
      - name: Sincronizar com o projeto iOS (Capacitor)
        script: npx cap sync ios
      - name: Incrementar número da build
        # CURRENT_PROJECT_VERSION fica fixo em "1" no projeto (gerado pelo
        # Capacitor) e nunca foi incrementado — a Apple rejeita qualquer
        # build com o mesmo número já usado no App Store Connect/TestFlight
        # ("The bundle version must be higher than the previously uploaded
        # version"). Duas tentativas anteriores falharam: (1)
        # `app-store-connect get-latest-build-number "$BUNDLE_ID"` espera o
        # Apple ID numérico, não o bundle id string — 404. (2) `$BUILD_NUMBER`
        # não é uma env var garantida pelo Codemagic nesse contexto — ficou
        # vazia, agvtool não fez nada, e a build instalada continuou como
        # "1" (confirmado ao vivo no TestFlight, 2026-08-29). `git rev-list
        # --count` foi cogitado mas depende do clone ser completo (não raso)
        # — não verificado, risco desnecessário. Usa timestamp
        # (AAAAMMDDHHMMSS) — não depende de nenhuma env var, API externa ou
        # profundidade do clone, e é garantidamente crescente entre builds.
        script: |
          #!/usr/bin/env bash
          set -e
          set -x
          BUILD_NUM=$(date -u +%Y%m%d%H%M%S)
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUM"
      - name: Buscar ou gerar certificado e provisioning profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Inicializar o keychain do CI
        script: keychain initialize
      - name: Adicionar certificado ao keychain
        script: keychain add-certificates
      - name: Aplicar assinatura no projeto Xcode
        script: xcode-project use-profiles
      - name: Compilar e gerar o .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # "Orbi Test" é grupo INTERNO (Users & Access, não Beta App Review) —
        # associar aqui não passa pela Beta App Review da Apple, só evita ter
        # que fazer manualmente no App Store Connect a cada build (reportado
        # ao vivo por Lucas, 2026-08-30 — cada build nova exigia repetir os
        # passos manuais toda hora). Testadores externos (treinadores do
        # beta) entram só quando o app for pra App Store de verdade.
        submit_to_testflight: true
        beta_groups:
          - Orbi Test
