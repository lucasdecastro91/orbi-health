<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>ORBI HEALTH</title>
  <!--
    The ORBI mark — a 310° orbital arc with a trailing dot and focal point.
    Gap positioned at upper-right (~315°), suggesting perpetual motion
    around a central axis.

    Arc: center (32,32), radius 20, from 340° to 290° clockwise
    Gap dot (orbiting body): midpoint of gap at 315°
    Center dot: focal point of the orbit
  -->

  <!-- Orbital arc — the path of orbit, 310° sweep, gap at upper-right -->
  <path
    d="M 50.8 25.2 A 20 20 0 1 1 38.8 13.2"
    stroke="#16a34a"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- The orbiting body — a node caught mid-orbit in the gap -->
  <circle cx="46.1" cy="17.9" r="4.5" fill="#16a34a"/>

  <!-- Orbital focal point — the center, the axis everything revolves around -->
  <circle cx="32" cy="32" r="2" fill="#16a34a"/>
</svg>
