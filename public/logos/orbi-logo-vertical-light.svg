<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 128" fill="none">
  <title>ORBI HEALTH — vertical</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700&amp;display=swap');
    </style>
  </defs>

  <!--
    Layout vertical: símbolo centralizado no topo,
    ORBI e HEALTH empilhados abaixo com espaçamento generoso.
    Símbolo centralizado na largura de 140px → offset x = (140-64)/2 = 38
  -->

  <!-- ── SYMBOL — centralizado ─────────────────────────────── -->
  <g transform="translate(38, 6)">
    <!-- Orbital arc -->
    <path
      d="M 50.8 25.2 A 20 20 0 1 1 38.8 13.2"
      stroke="#16a34a"
      stroke-width="5"
      stroke-linecap="round"
    />
    <!-- Orbiting body -->
    <circle cx="46.1" cy="17.9" r="4.5" fill="#16a34a"/>
    <!-- Focal point -->
    <circle cx="32" cy="32" r="2" fill="#16a34a"/>
  </g>

  <!-- ── WORDMARK — centralizado abaixo ──────────────────────── -->
  <!-- "ORBI" — grande, bold, ancoragem visual forte -->
  <text
    x="70"
    y="95"
    text-anchor="middle"
    font-family="'Inter', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="1"
    fill="#1a1a1a"
  >ORBI</text>

  <!-- "HEALTH" — pequeno, light, tracking largo -->
  <text
    x="71.5"
    y="113"
    text-anchor="middle"
    font-family="'Inter', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="10.5"
    font-weight="300"
    letter-spacing="4"
    fill="#1a1a1a"
  >HEALTH</text>
</svg>
