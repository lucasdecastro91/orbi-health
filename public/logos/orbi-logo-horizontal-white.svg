<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 64" fill="none">
  <title>ORBI HEALTH — versão branca</title>
  <!--
    Versão totalmente branca — para uso sobre fundo verde (#16a34a),
    fundo escuro saturado, ou qualquer fundo de cor forte.
  -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700&amp;display=swap');
    </style>
  </defs>

  <!-- ── SYMBOL — todo branco ──────────────────────────────── -->
  <path
    d="M 50.8 25.2 A 20 20 0 1 1 38.8 13.2"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
  />
  <circle cx="46.1" cy="17.9" r="4.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>

  <!-- ── WORDMARK — todo branco ─────────────────────────────── -->
  <text
    x="76"
    y="36"
    font-family="'Inter', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="0.5"
    fill="#ffffff"
  >ORBI</text>

  <text
    x="76.5"
    y="51"
    font-family="'Inter', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="300"
    letter-spacing="3.8"
    fill="rgba(255,255,255,0.75)"
  >HEALTH</text>
</svg>
