<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 64" fill="none">
  <title>ORBI HEALTH</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700&amp;display=swap');
    </style>
  </defs>

  <!-- ── SYMBOL ──────────────────────────────────────────── -->
  <!-- Orbital arc — 310° clockwise, gap at upper-right -->
  <path
    d="M 50.8 25.2 A 20 20 0 1 1 38.8 13.2"
    stroke="#16a34a"
    stroke-width="5"
    stroke-linecap="round"
  />
  <!-- Orbiting body in the gap -->
  <circle cx="46.1" cy="17.9" r="4.5" fill="#16a34a"/>
  <!-- Orbital focal point -->
  <circle cx="32" cy="32" r="2" fill="#16a34a"/>

  <!-- ── WORDMARK ─────────────────────────────────────────── -->
  <!-- "ORBI" — heavy, anchor weight -->
  <text
    x="76"
    y="36"
    font-family="'Inter', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="0.5"
    fill="#1a1a1a"
  >ORBI</text>

  <!-- "HEALTH" — light, spaced, subordinate -->
  <text
    x="76.5"
    y="51"
    font-family="'Inter', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="300"
    letter-spacing="3.8"
    fill="#1a1a1a"
  >HEALTH</text>
</svg>
