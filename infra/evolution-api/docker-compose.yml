version: "3.8"

# Stack da Evolution API pro beta do WhatsApp (ORBI Health).
# Postgres e Redis aqui são dedicados a isso — não usam o Postgres do Supabase,
# pra não acoplar o risco dessa peça nova ao banco de produção do ORBI.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - evolution_net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      # --- Geral ---
      SERVER_URL: ${EVOLUTION_PUBLIC_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # --- Banco (dedicado, não é o Supabase) ---
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      # Desligados (contatos/chats/histórico/labels): reduz a carga no momento
      # do pareamento — mesmo achado da issue de tracking de QR/pareamento da
      # Evolution API (2026). Não afeta o recurso de chat 1:1 que já construímos,
      # que grava mensagem por mensagem direto em whatsapp_messages, não aqui.
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_DATA_LABELS: "false"

      # --- Cache/estado de sessão ---
      # Redis desligado: em VPS de 1 vCPU (KVM1), a latência extra do Redis
      # durante a troca de pre-keys do primeiro pareamento contribuía pra
      # falha "não é possível conectar novos dispositivos" (achado documentado
      # na comunidade da Evolution API, 2026). Cache local resolve sem depender
      # de outro serviço na mesma CPU.
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      # --- Versão do WhatsApp Web reportada pelo Baileys ---
      # Fixa uma versão de protocolo conhecida-compatível, em vez de deixar a
      # lib detectar sozinha — mitigação documentada pra esse mesmo erro de
      # pareamento na comunidade da Evolution API (2026).
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1033773198"

      # --- Webhook: aponta pra Edge Function receptora no Supabase ---
      # WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS precisa ficar false: com true, a
      # Evolution API acrescenta "/<nome-do-evento>" no final da URL — como
      # nossa URL já termina em "?token=...", isso corrompia o token
      # (virava parte do valor dele) e todo webhook chegava com 401.
      # Nosso whatsapp-webhook já lê o tipo de evento do corpo (payload.event),
      # não precisa vir separado na URL.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${SUPABASE_WEBHOOK_URL}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"

    # Sem "ports" aqui de propósito — só o Caddy fica exposto à internet (443).
    # A Evolution API só é alcançável dentro da rede interna do Docker.
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - evolution-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - evolution_net

networks:
  evolution_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  caddy_data:
  caddy_config:
