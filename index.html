<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- initial-scale=1.0 exato tem um bug conhecido no WKWebView (o motor do
         Capacitor no iOS) onde o viewport é calculado maior que a tela real,
         cortando conteúdo sem dar pra ajustar (zoom desabilitado). 1.0001 força
         o WebKit a recalcular certo. Essa correção sozinha (2026-08-27) NÃO
         resolveu o bug de tela "arrastável"/maior que o device relatado ao
         vivo (2026-08-29) — o que faltava era travar o zoom de verdade:
         sem maximum-scale/user-scalable, nada impede o WKWebView de ficar
         com um zoomScale > 1 preso (gesto de pinça, ou o próprio WebKit
         recalculando errado), e aí a tela toda vira arrastável revelando
         conteúdo atrás de elementos fixed. maximum-scale=1 + user-scalable=no
         bloqueiam qualquer zoom, nativo ou por gesto. viewport-fit=cover
         habilita env(safe-area-inset-*) corretamente (notch/home indicator). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0001, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ORBI Health</title>
    <meta name="description" content="ORBI Health é a plataforma white-label para personal trainers e coaches venderem seus serviços online com dieta, treino e acompanhamento completo." />

    <!-- Meta tags essenciais -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ORBI Health" />

    <!-- Favicons e PWA -->
    <link rel="icon" href="/logos/orbi-app-icon-hd.png" type="image/png">
    <link rel="shortcut icon" href="/logos/orbi-app-icon-hd.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Favicon dinâmico: roda antes do React, sem flash -->
    <script>
      (function () {
        try {
          var segs = window.location.pathname.split('/').filter(Boolean);
          var isGS = segs.indexOf('getshape') !== -1;
          if (isGS) {
            document.querySelectorAll('link[rel~="icon"]').forEach(function (el) {
              el.parentNode && el.parentNode.removeChild(el);
            });
            var lnk = document.createElement('link');
            lnk.rel  = 'icon';
            lnk.type = 'image/png';
            lnk.href = '/favicon-gs.png';
            document.head.appendChild(lnk);
            document.title = 'Get Shape Training';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">

    <!-- Fonte do app (Manrope) — teste 2026-08-03, reversível: ver tailwind.config.ts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.orbihealth.com.br" />
    <meta property="og:title" content="ORBI Health" />
    <meta property="og:description" content="Plataforma white-label para personal trainers e coaches, com dieta, treino e acompanhamento completo." />
    <meta property="og:image" content="https://app.orbihealth.com.br/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ORBI Health" />
    <meta name="twitter:description" content="Plataforma white-label para personal trainers e coaches, com dieta, treino e acompanhamento completo." />
    <meta name="twitter:image" content="https://app.orbihealth.com.br/icon-512.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://app.orbihealth.com.br" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
